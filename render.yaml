services:
  - type: web
    name: rz-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: INWORLD_API_KEY
        sync: false
      - key: INWORLD_VOICE_ID
        value: Ashley
      - key: INWORLD_TTS_MODEL
        value: inworld-tts-2
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_CODING_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_ANALYSIS_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_ZDR
        value: "false"
      - key: OPENROUTER_ALLOW_FALLBACKS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: APP_ENV
        value: production
